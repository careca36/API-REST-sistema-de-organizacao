version: "3.9"

services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: organizacao
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: api_organizacao
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/organizacao
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy && node src/server.js"

volumes:
  postgres_data:
